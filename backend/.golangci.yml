version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck

  exclusions:
    generated: disable
    rules:
      - source: "^// Code generated .* DO NOT EDIT\\.$"
        linters:
          - errcheck
          - govet
          - staticcheck

issues:
  max-same-issues: 3