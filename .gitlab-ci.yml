stages:
  - lint
  - build

# Линтер для Go (golangci-lint)
lint-backend:
  stage: lint
  image: golangci/golangci-lint:v1.60.3-alpine
  script:
    - cd backend
    - golangci-lint run ./...

# Линтер для React (oxlint)
lint-frontend:
  stage: lint
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint

build-app:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build